name: Update profile archive

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-archive
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate public profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Hyhyhyyy
        run: node scripts/update-profile.mjs

      - name: Commit changed statistics
        shell: bash
        run: |
          if git diff --quiet -- assets/stats.svg assets/tomato-heatmap.svg assets/tomato-heatmap-mobile.svg; then
            echo "No profile visuals changed."
            exit 0
          fi
          git config user.name "Hyhyhyyy"
          git config user.email "235096668+Hyhyhyyy@users.noreply.github.com"
          git add assets/stats.svg assets/tomato-heatmap.svg assets/tomato-heatmap-mobile.svg
          git commit -m "chore: refresh profile laboratory data"
          git push
