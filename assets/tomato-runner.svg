<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">Keep growing</title><desc id="desc">A giant tomato rolls slowly through an abstract color landscape.</desc>
  <style>text{font-family:Arial,"Microsoft YaHei",sans-serif}.move{animation:m 8s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:r 8s ease-in-out infinite}.wave{animation:w 8s ease-in-out infinite}@keyframes m{0%,8%{transform:translateX(0)}48%,55%{transform:translateX(220px)}92%,100%{transform:translateX(0)}}@keyframes r{0%,8%{transform:rotate(0)}48%,55%{transform:rotate(520deg)}92%,100%{transform:rotate(0)}}@keyframes w{50%{transform:translateX(24px)}}@media(prefers-reduced-motion:reduce){.move{animation:none;transform:translateX(110px)}.spin,.wave{animation:none}}</style>
  <rect width="1000" height="220" rx="12" fill="#ff725c"/><path d="M0 156c172-53 315 67 512 10s328-21 488 12v42H0z" fill="#69d5d0"/><path class="wave" d="M-30 183c166-60 300 54 482 4s327-19 578 9" fill="none" stroke="#fff8e7" stroke-width="9" opacity=".72"/>
  <circle cx="538" cy="56" r="84" fill="#ffcf4d"/><circle cx="538" cy="56" r="55" fill="#fff8e7" opacity=".45"/>
  <text x="38" y="91" font-size="56" font-weight="900" letter-spacing="-2" fill="#173149">KEEP</text><text x="38" y="148" font-size="56" font-weight="900" letter-spacing="-2" fill="#fff8e7">GROWING.</text><text x="41" y="186" font-size="12" letter-spacing="2" fill="#173149">SLOWLY / BRAVELY / BRIGHTLY</text>
  <g transform="translate(665 111)"><g class="move"><ellipse cy="62" rx="64" ry="12" fill="#173149" opacity=".2"/><g class="spin"><circle r="62" fill="#ff4d35"/><ellipse cx="-20" cy="-22" rx="13" ry="20" fill="#ff9b86" opacity=".65"/><path d="M-41-44l29 6 12-37 14 35 40-10-27 28-32-9-28 17z" fill="#63bd59"/><path d="M0-53l9-27" stroke="#3d9648" stroke-width="9" stroke-linecap="round"/></g></g></g>
</svg>
