<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
  <title id="title">Rolling tomato activity</title><desc id="desc">A giant tomato rolls back and forth across a GitHub-inspired activity track.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0v26" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    :root{--bg:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#656d76;--grid:#d8dee4;--track:#afb8c1;--code:#0969da}
    text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.bg{fill:var(--bg)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.code{fill:var(--code)}
    .move{animation:travel 8s cubic-bezier(.45,.02,.55,.98) infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s cubic-bezier(.45,.02,.55,.98) infinite}.signal{animation:blink 1.1s steps(2,end) infinite}
    @keyframes travel{0%,5%{transform:translateX(0)}48%,52%{transform:translateX(810px)}95%,100%{transform:translateX(0)}}@keyframes spin{0%,5%{transform:rotate(0)}48%,52%{transform:rotate(720deg)}95%,100%{transform:rotate(0)}}@keyframes blink{50%{opacity:.25}}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--grid:#161b22;--track:#30363d;--code:#58a6ff}}
    @media(prefers-reduced-motion:reduce){.move{animation:none;transform:translateX(405px)}.spin,.signal{animation:none}}
  </style>
  <rect class="bg" x="1" y="1" width="998" height="208" rx="6" stroke="var(--border)"/><rect x="1" y="48" width="998" height="161" fill="url(#grid)" opacity=".72"/>
  <circle class="signal" cx="25" cy="25" r="5" fill="#3fb950"/><text class="code" x="39" y="30" font-size="13">$ ./tomato --mode=roll --energy=100</text><text class="muted" x="787" y="30" font-size="10">ANIMATION_STATUS: LIVE</text>
  <path d="M48 166H952" stroke="var(--track)" stroke-width="2" stroke-dasharray="7 8"/><path d="M48 177H952" stroke="var(--border)"/>
  <text class="muted" x="48" y="196" font-size="9">0x00</text><text class="muted" x="471" y="196" font-size="9">KEEP SHIPPING</text><text class="muted" x="922" y="196" font-size="9">0xFF</text>
  <g transform="translate(70 137)"><g class="move">
    <ellipse cx="0" cy="37" rx="52" ry="9" fill="#000" opacity=".2"/>
    <g class="spin" filter="url(#glow)">
      <circle r="55" fill="#ff5138"/><circle cx="-18" cy="-21" r="14" fill="#ff806b" opacity=".58"/>
      <path d="M-34-39l25 5 9-29 12 28 34-7-22 23-27-7-24 13z" fill="#72c45c"/>
      <path d="M0-47l7-22" stroke="#4c983e" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-19" cy="-2" r="5" fill="#172b39"/><circle cx="19" cy="-2" r="5" fill="#172b39"/><path d="M-19 19q19 18 38 0" fill="none" stroke="#fff7ea" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-34" cy="12" r="8" fill="#ff9a83" opacity=".8"/><circle cx="34" cy="12" r="8" fill="#ff9a83" opacity=".8"/>
    </g>
  </g></g>
  <path d="M22 92h35M15 109h27M27 126h21" stroke="#48bfe3" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
