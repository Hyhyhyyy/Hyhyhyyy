<svg xmlns="http://www.w3.org/2000/svg" width="390" height="180" viewBox="0 0 390 180" role="img" aria-labelledby="title desc">
  <title id="title">Rolling tomato activity</title><desc id="desc">A giant tomato rolls back and forth on mobile.</desc>
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0v20" fill="none" stroke="var(--grid)"/></pattern><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>
    :root{--bg:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#656d76;--grid:#d8dee4;--track:#afb8c1;--code:#0969da}text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.bg{fill:var(--bg)}.muted{fill:var(--muted)}.code{fill:var(--code)}.move{animation:travel 6.8s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 6.8s ease-in-out infinite}.signal{animation:blink 1.1s steps(2,end) infinite}@keyframes travel{0%,6%{transform:translateX(0)}47%,53%{transform:translateX(258px)}94%,100%{transform:translateX(0)}}@keyframes spin{0%,6%{transform:rotate(0)}47%,53%{transform:rotate(540deg)}94%,100%{transform:rotate(0)}}@keyframes blink{50%{opacity:.25}}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--grid:#161b22;--track:#30363d;--code:#58a6ff}}@media(prefers-reduced-motion:reduce){.move{animation:none;transform:translateX(129px)}.spin,.signal{animation:none}}
  </style>
  <rect class="bg" x="1" y="1" width="388" height="178" rx="6" stroke="var(--border)"/><rect x="1" y="41" width="388" height="138" fill="url(#grid)" opacity=".72"/><circle class="signal" cx="17" cy="20" r="4" fill="#3fb950"/><text class="code" x="28" y="24" font-size="9">$ tomato --roll --energy=100</text><text class="muted" x="321" y="24" font-size="7">LIVE</text>
  <path d="M28 139H362" stroke="var(--track)" stroke-width="2" stroke-dasharray="5 6"/><text class="muted" x="27" y="166" font-size="7">0x00</text><text class="muted" x="160" y="166" font-size="7">KEEP SHIPPING</text><text class="muted" x="338" y="166" font-size="7">0xFF</text>
  <g transform="translate(64 119)"><g class="move"><ellipse cy="28" rx="39" ry="7" fill="#000" opacity=".2"/><g class="spin" filter="url(#glow)"><circle r="41" fill="#ff5138"/><circle cx="-14" cy="-16" r="10" fill="#ff806b" opacity=".58"/><path d="M-25-29l18 4 7-22 9 21 25-5-17 17-20-5-18 10z" fill="#72c45c"/><path d="M0-35l5-16" stroke="#4c983e" stroke-width="5" stroke-linecap="round"/><circle cx="-14" cy="-1" r="3.5" fill="#172b39"/><circle cx="14" cy="-1" r="3.5" fill="#172b39"/><path d="M-14 14q14 13 28 0" fill="none" stroke="#fff7ea" stroke-width="4.5" stroke-linecap="round"/><circle cx="-25" cy="9" r="6" fill="#ff9a83" opacity=".8"/><circle cx="25" cy="9" r="6" fill="#ff9a83" opacity=".8"/></g></g></g>
  <path d="M12 73h27M8 88h21M17 102h17" stroke="#48bfe3" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
</svg>
