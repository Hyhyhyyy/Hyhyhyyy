<svg xmlns="http://www.w3.org/2000/svg" width="390" height="380" viewBox="0 0 390 380" role="img" aria-labelledby="title desc">
  <title id="title">Hyhyhyyy grows in color mobile</title><desc id="desc">An airy mobile landscape with a floating tomato sun.</desc>
  <defs><radialGradient id="fruit"><stop stop-color="#ff8b73"/><stop offset=".72" stop-color="#ff5a43"/><stop offset="1" stop-color="#ed4336"/></radialGradient><filter id="soft" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#702419" flood-opacity=".23"/></filter></defs>
  <style>text{font-family:Arial,"Microsoft YaHei",sans-serif}.serif{font-family:Georgia,"Noto Serif SC","Microsoft YaHei",serif}.mono{font-family:ui-monospace,Consolas,monospace}.sun{transform-box:fill-box;transform-origin:center;animation:f 7s ease-in-out infinite}.leaf{transform-box:fill-box;transform-origin:center bottom;animation:s 5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-10px)}}@keyframes s{50%{transform:rotate(7deg)}}@media(prefers-color-scheme:dark){.base{fill:#0f1c2a}.title{fill:#f6f3e9}.copy{fill:#b9c7d0}.motto{fill:#fff4c9}.pill{fill:#fff4c9}.pillText{fill:#173149}}@media(prefers-reduced-motion:reduce){.sun,.leaf{animation:none}}</style>
  <rect class="base" width="390" height="380" rx="14" fill="#fff8e7"/><path d="M0 0h390v68H0z" fill="#69d5d0"/><path d="M0 304h390v76H0z" fill="#ffcf4d"/><path d="M0 351h390v29H0z" fill="#ff725c"/>
  <circle cx="294" cy="124" r="92" fill="#ff725c" opacity=".12"/><g transform="translate(294 127)" filter="url(#soft)"><g class="sun"><circle r="70" fill="url(#fruit)"/><ellipse cx="-22" cy="-27" rx="14" ry="24" fill="#ffb29f" opacity=".5"/><g class="leaf"><path d="M-45-49l31 5 14-42 16 41 44-12-29 31-36-11-31 19z" fill="#63bd59"/><path d="M2-61l8-31" stroke="#3d9648" stroke-width="9" stroke-linecap="round"/></g></g></g>
  <circle cx="365" cy="221" r="27" fill="#ff725c"/><path d="M349 202l11 3 5-16 6 15 17-4-12 12-13-4-12 7z" fill="#63bd59"/>
  <rect class="pill" x="20" y="89" width="108" height="25" rx="12" fill="#173149"/><text class="mono pillText" x="35" y="106" font-size="8" fill="#fff8e7">GROW IN COLOR</text>
  <text class="title" x="19" y="207" font-size="51" font-weight="900" letter-spacing="-3" fill="#173149">Hyhyhyyy</text><path d="M21 224c54-8 112 10 190-3" fill="none" stroke="#ff5a43" stroke-width="5" stroke-linecap="round"/>
  <text class="serif motto" x="20" y="265" font-size="19" font-weight="700" fill="#173149">&#25964;&#65292;&#30495;&#30456;&#19982;&#33258;&#30001;&#12290;</text><text class="copy" x="20" y="288" font-size="10" fill="#486071">&#22823;&#36830;&#29702;&#24037;&#22823;&#23398; &#183; &#36719;&#20214;&#23398;&#38498; &#183; 2029</text>
  <text class="mono" x="20" y="335" font-size="7" letter-spacing=".7" fill="#173149">CURIOUS / RELIABLE / ALWAYS GROWING</text>
</svg>
