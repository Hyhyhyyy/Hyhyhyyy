<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc">
  <title id="title">Mobile tomato laboratory</title><desc id="desc">Compact Tomato OS, X-ray and collider panels.</desc>
  <style>:root{--bg:#fff7d1;--p:#fff;--b:#172b39;--f:#172b39;--m:#65717a}text{font-family:ui-monospace,Consolas,monospace}.p{fill:var(--p);stroke:var(--b);stroke-width:1.5}.f{fill:var(--f)}.m{fill:var(--m)}.blink{animation:b 1s steps(2,end) infinite}.scan{animation:s 3s ease-in-out infinite}.l{animation:l 4s ease-in-out infinite}.r{animation:r 4s ease-in-out infinite}@keyframes b{50%{opacity:.2}}@keyframes s{50%{transform:translateY(80px)}}@keyframes l{50%{transform:translateX(32px)}}@keyframes r{50%{transform:translateX(-32px)}}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--p:#161b22;--b:#48d7e8;--f:#f0f6fc;--m:#8b949e}}@media(prefers-reduced-motion:reduce){.blink,.scan,.l,.r{animation:none}}</style>
  <rect x="1" y="1" width="388" height="648" rx="10" fill="var(--bg)" stroke="var(--b)"/><text class="f" x="18" y="28" font-size="10" font-weight="700">HYHY / ABSTRACT TOMATO SYSTEMS</text><rect x="306" y="13" width="66" height="21" rx="10" fill="#ff4d35"/><text x="321" y="27" font-size="7" fill="#fff">LAB 03</text>
  <rect class="p" x="16" y="48" width="358" height="178" rx="7"/><path d="M16 82h358" stroke="var(--b)"/><circle cx="32" cy="65" r="4" fill="#ff4d35"/><circle cx="45" cy="65" r="4" fill="#fff04a"/><circle cx="58" cy="65" r="4" fill="#63c54b"/><text class="f" x="74" y="69" font-size="9" font-weight="700">TOMATO_OS.exe</text><text x="31" y="105" font-size="8" fill="#48bfe3">[BOOT] curiosity ........ OK</text><text class="f" x="31" y="126" font-size="8">agent.kernel ............ OK</text><text class="f" x="31" y="147" font-size="8">kotlin.runtime .......... OK</text><text x="31" y="168" font-size="8" fill="#ff4d35">WARNING: tomato overflow</text><rect x="29" y="184" width="326" height="25" fill="#172b39"/><text x="40" y="201" font-size="8" fill="#83e85f">&gt; grow --without-limit <tspan class="blink">_</tspan></text>
  <rect class="p" x="16" y="242" width="358" height="178" rx="7"/><path d="M16 276h358" stroke="var(--b)"/><text class="f" x="31" y="264" font-size="9" font-weight="700">XRAY / SPECIMEN_07</text><circle cx="118" cy="345" r="51" fill="none" stroke="#48d7e8" stroke-width="2"/><circle cx="118" cy="345" r="37" fill="none" stroke="#48d7e8" stroke-dasharray="4 5"/><path d="M97 312l16 4 5-22 7 21 23-6-16 17-17-6-16 10z" fill="none" stroke="#63c54b" stroke-width="2"/><path d="M118 300v90M73 345h90" stroke="#48d7e8" opacity=".45"/><path class="scan" d="M66 300h104v18H66z" fill="#fff04a" opacity=".4"/><text class="m" x="194" y="323" font-size="8">RADIUS 54.0</text><text class="m" x="194" y="344" font-size="8">SEEDS UNLIMITED</text><text x="194" y="365" font-size="8" fill="#ff4d35">OPTIMISTIC</text><text x="194" y="386" font-size="8" fill="#ff4d35">FRUIT</text>
  <rect class="p" x="16" y="436" width="358" height="194" rx="7"/><path d="M16 470h358" stroke="var(--b)"/><text class="f" x="31" y="458" font-size="9" font-weight="700">TOMATO COLLIDER / LIVE</text><ellipse cx="195" cy="548" rx="116" ry="57" fill="none" stroke="#48d7e8" stroke-width="2" stroke-dasharray="7 7"/><g transform="translate(104 548)"><g class="l"><circle r="25" fill="#ff4d35"/><path d="M-15-18l11 2 4-15 6 14 17-4-12 12-13-4-12 7z" fill="#63c54b"/></g></g><g transform="translate(286 548)"><g class="r"><circle r="25" fill="#ff713d"/><path d="M-15-18l11 2 4-15 6 14 17-4-12 12-13-4-12 7z" fill="#83e85f"/></g></g><circle class="blink" cx="195" cy="548" r="11" fill="#fff04a"/><text class="m" x="31" y="606" font-size="8">ENERGY 100% / CHAOS FRIENDLY</text>
</svg>
