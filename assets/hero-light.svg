<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Hyhyhyyy Tomato Laboratory</title><desc id="desc">A bright experimental profile cover built from stacked tomatoes.</desc>
