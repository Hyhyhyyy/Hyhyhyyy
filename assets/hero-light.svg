<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Hyhyhyyy grows in color</title><desc id="desc">An airy editorial landscape with a slowly floating tomato sun.</desc>
  <defs>
    <radialGradient id="fruit"><stop stop-color="#ff806b"/><stop offset=".68" stop-color="#ff5a43"/><stop offset="1" stop-color="#ef4434"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#702419" flood-opacity=".2"/></filter>
  </defs>
  <style>text{font-family:Arial,"Microsoft YaHei",sans-serif}.serif{font-family:Georgia,"Noto Serif SC","Microsoft YaHei",serif}.mono{font-family:ui-monospace,Consolas,monospace}.sun{transform-box:fill-box;transform-origin:center;animation:float 7s ease-in-out infinite}.leaf{transform-box:fill-box;transform-origin:center bottom;animation:sway 5s ease-in-out infinite}.cloud1{animation:drift 14s ease-in-out infinite}.cloud2{animation:drift 18s ease-in-out infinite reverse}.line{stroke-dasharray:280;animation:draw 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-15px)}}@keyframes sway{50%{transform:rotate(7deg)}}@keyframes drift{50%{transform:translateX(32px)}}@keyframes draw{0%,100%{stroke-dashoffset:280}45%,70%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.sun,.leaf,.cloud1,.cloud2,.line{animation:none}}</style>
  <rect width="1000" height="480" rx="18" fill="#fff8e7"/><path d="M0 0h1000v92H0z" fill="#69d5d0"/><path d="M0 376h1000v104H0z" fill="#ffcf4d"/><path d="M0 430h1000v50H0z" fill="#ff725c"/>
  <g class="cloud1" opacity=".72"><ellipse cx="154" cy="73" rx="92" ry="24" fill="#fff8e7"/><ellipse cx="215" cy="67" rx="66" ry="31" fill="#fff8e7"/></g><g class="cloud2" opacity=".5"><ellipse cx="770" cy="52" rx="96" ry="23" fill="#fff8e7"/><ellipse cx="835" cy="61" rx="70" ry="28" fill="#fff8e7"/></g>
  <circle cx="810" cy="168" r="220" fill="#ff725c" opacity=".12"/><circle cx="810" cy="168" r="188" fill="#ff725c" opacity=".12"/>
  <g transform="translate(810 168)" filter="url(#soft)"><g transform="scale(1.4)"><g class="sun"><circle r="119" fill="url(#fruit)"/><ellipse cx="-36" cy="-42" rx="25" ry="42" fill="#ffac98" opacity=".5"/><g class="leaf"><path d="M-75-84l50 8 25-71 25 69 73-20-48 52-59-18-51 31z" fill="#63bd59"/><path d="M2-103l14-56" stroke="#3d9648" stroke-width="15" stroke-linecap="round"/></g></g></g></g>
  <circle cx="617" cy="342" r="33" fill="#ff725c"/><path d="M597 318l15 3 6-20 8 19 22-5-14 15-18-5-15 8z" fill="#63bd59"/><circle cx="935" cy="130" r="24" fill="#ffcf4d"/><circle cx="919" cy="110" r="9" fill="#ff725c"/>
  <rect x="42" y="122" width="128" height="28" rx="14" fill="#173149"/><text class="mono" x="60" y="141" font-size="10" fill="#fff8e7">GROW IN COLOR</text>
  <text x="40" y="246" font-size="91" font-weight="900" letter-spacing="-6" fill="#173149">Hyhyhyyy</text><path class="line" d="M43 269c91-13 197 18 330-4" fill="none" stroke="#ff5a43" stroke-width="7" stroke-linecap="round"/>
