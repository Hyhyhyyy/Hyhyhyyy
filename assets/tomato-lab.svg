<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Tomato experimental laboratory</title><desc id="desc">Tomato OS, an X-ray blueprint and a tomato particle collider.</desc>
  <defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0v18" fill="none" stroke="var(--grid)"/></pattern><clipPath id="xclip"><rect x="357" y="75" width="276" height="302" rx="8"/></clipPath></defs>
  <style>
    :root{--bg:#fff7d1;--panel:#fff;--border:#172b39;--fg:#172b39;--muted:#65717a;--grid:#d8dee4}text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.panel{fill:var(--panel);stroke:var(--border);stroke-width:2}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.blink{animation:blink 1s steps(2,end) infinite}.scan{animation:scan 3.4s ease-in-out infinite}.left{animation:left 4.2s ease-in-out infinite}.right{animation:right 4.2s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
    @keyframes blink{50%{opacity:.2}}@keyframes scan{0%,100%{transform:translateY(-120px)}50%{transform:translateY(220px)}}@keyframes left{0%,100%{transform:translateX(0)}50%{transform:translateX(72px)}}@keyframes right{0%,100%{transform:translateX(0)}50%{transform:translateX(-72px)}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#48d7e8;--fg:#f0f6fc;--muted:#8b949e;--grid:#21262d}}@media(prefers-reduced-motion:reduce){.blink,.scan,.left,.right,.ring{animation:none}}
  </style>
  <rect x="1" y="1" width="998" height="418" rx="12" fill="var(--bg)" stroke="var(--border)"/><rect x="1" y="1" width="998" height="418" rx="12" fill="url(#grid)" opacity=".7"/>
  <text class="fg" x="25" y="35" font-size="13" font-weight="700">HYHY / ABSTRACT TOMATO SYSTEMS</text><rect x="820" y="17" width="154" height="25" rx="12" fill="#ff4d35"/><text x="842" y="34" font-size="9" fill="#fff">EXPERIMENTS: 03</text>
  <rect class="panel" x="24" y="63" width="309" height="326" rx="8"/><path d="M24 104h309" stroke="var(--border)" stroke-width="2"/><circle cx="45" cy="84" r="5" fill="#ff4d35"/><circle cx="62" cy="84" r="5" fill="#fff04a"/><circle cx="79" cy="84" r="5" fill="#63c54b"/><text class="fg" x="99" y="88" font-size="11" font-weight="700">TOMATO_OS.exe</text>
  <text x="43" y="134" font-size="10" fill="#48bfe3">[BOOT] loading curiosity...</text><text class="fg" x="43" y="159" font-size="10">agent.kernel ........ OK</text><text class="fg" x="43" y="184" font-size="10">kotlin.runtime ...... OK</text><text class="fg" x="43" y="209" font-size="10">frontend.sensor ..... OK</text><text x="43" y="234" font-size="10" fill="#ff4d35">WARNING: tomato overflow</text>
  <rect x="43" y="260" width="270" height="78" fill="#172b39"/><text x="57" y="284" font-size="9" fill="#83e85f">&gt; grow --without-limit</text><text x="57" y="307" font-size="9" fill="#fff04a">PROCESS_ID: HY-2029</text><text class="blink" x="57" y="328" font-size="12" fill="#48d7e8">_</text><text class="muted" x="43" y="365" font-size="9">uptime: curiosity is still running</text>
  <rect class="panel" x="357" y="63" width="276" height="326" rx="8"/><path d="M357 104h276" stroke="var(--border)" stroke-width="2"/><text class="fg" x="377" y="88" font-size="11" font-weight="700">XRAY / SPECIMEN_07</text>
  <g clip-path="url(#xclip)"><circle cx="495" cy="238" r="89" fill="none" stroke="#48d7e8" stroke-width="2"/><circle cx="495" cy="238" r="67" fill="none" stroke="#48d7e8" stroke-dasharray="5 6"/><path d="M459 181l27 7 9-39 13 38 39-10-26 29-30-10-28 17z" fill="none" stroke="#63c54b" stroke-width="3"/><path d="M495 171v135M428 238h134M447 191l96 96M543 191l-96 96" stroke="#48d7e8" opacity=".45"/><circle cx="495" cy="238" r="19" fill="#ff4d35" opacity=".8"/><path class="scan" d="M367 125h256v35H367z" fill="#fff04a" opacity=".42"/></g><text class="muted" x="377" y="349" font-size="9">RADIUS 54.0 / SEEDS UNLIMITED</text><text x="377" y="368" font-size="9" fill="#ff4d35">CLASS: OPTIMISTIC FRUIT</text>
  <rect class="panel" x="657" y="63" width="317" height="326" rx="8"/><path d="M657 104h317" stroke="var(--border)" stroke-width="2"/><text class="fg" x="677" y="88" font-size="11" font-weight="700">TOMATO COLLIDER / LIVE</text>
  <g class="ring"><ellipse cx="815" cy="236" rx="118" ry="82" fill="none" stroke="#48d7e8" stroke-width="2" stroke-dasharray="9 8"/><ellipse cx="815" cy="236" rx="76" ry="118" fill="none" stroke="#fff04a" stroke-width="2" stroke-dasharray="6 9"/></g>
  <g transform="translate(711 236)"><g class="left"><circle r="32" fill="#ff4d35"/><path d="M-20-23l14 3 6-19 8 18 21-5-15 16-17-6-15 9z" fill="#63c54b"/></g></g><g transform="translate(919 236)"><g class="right"><circle r="32" fill="#ff713d"/><path d="M-20-23l14 3 6-19 8 18 21-5-15 16-17-6-15 9z" fill="#83e85f"/></g></g><circle class="blink" cx="815" cy="236" r="15" fill="#fff04a"/><path d="M815 169v134M748 236h134" stroke="var(--fg)" opacity=".25"/>
  <text class="muted" x="677" y="349" font-size="9">ENERGY: 100% / CHAOS: FRIENDLY</text><text x="677" y="368" font-size="9" fill="#48bfe3">NEXT COLLISION IN 00:04.2</text>
</svg>
