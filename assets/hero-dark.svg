<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Hyhyhyyy grows in color at night</title><desc id="desc">A cinematic night landscape with a glowing tomato sun.</desc>
