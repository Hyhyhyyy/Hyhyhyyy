  <style>text{font-family:Arial,"Microsoft YaHei",sans-serif}.serif{font-family:Georgia,"Noto Serif SC","Microsoft YaHei",serif}.mono{font-family:ui-monospace,Consolas,monospace}.sun{transform-box:fill-box;transform-origin:center;animation:float 7s ease-in-out infinite}.leaf{transform-box:fill-box;transform-origin:center bottom;animation:sway 5s ease-in-out infinite}.star{animation:blink 3s ease-in-out infinite}.line{stroke-dasharray:280;animation:draw 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-15px)}}@keyframes sway{50%{transform:rotate(7deg)}}@keyframes blink{50%{opacity:.18}}@keyframes draw{0%,100%{stroke-dashoffset:280}45%,70%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.sun,.leaf,.star,.line{animation:none}}</style>
